apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wealthfolio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yoanbaulande/homelab-infra.git
    targetRevision: main
    path: services/wealthfolio
  destination:
    server: https://kubernetes.default.svc
    namespace: wealthfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
